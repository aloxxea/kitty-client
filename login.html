<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Kitty Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">

  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">Kitty<span class="logo__dot"></span></a>
      <nav class="nav">
        <a href="index.html#features">Возможности</a>
        <a href="index.html#pricing">Тарифы</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">
        <span class="theme-toggle__icon" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="auth">
    <div class="auth__card">
      <h1 class="auth__title">Вход в аккаунт</h1>

      <form id="loginForm" class="auth__form">
        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="field__input" type="email" id="email" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <input class="field__input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn--accent btn--full">Войти</button>
        <p id="loginError" class="auth__error"></p>
      </form>

      <form id="twoFaForm" class="auth__form" hidden>
        <p class="auth__subtitle" id="twoFaInfo">Введите код из Telegram</p>
        <div class="field">
          <label class="field__label" for="twoFaCode">Код 2FA</label>
          <input class="field__input" type="text" id="twoFaCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="••••••" autocomplete="one-time-code">
        </div>
        <button type="submit" id="twoFaSubmit" class="btn btn--accent btn--full">Подтвердить</button>
        <button type="button" id="twoFaBack" class="auth__demo">← Назад к входу</button>
        <p id="twoFaError" class="auth__error"></p>
      </form>

      <p class="auth__alt">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
      <button id="demoLogin" class="auth__demo">👀 Войти как гость (демо-мод)</button>
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const error = document.getElementById("loginError");
    const twoFaForm = document.getElementById("twoFaForm");
    const twoFaError = document.getElementById("twoFaError");
    const SITE = window.KITTY_CONFIG.SUPABASE_URL;

    let pendingSession = null;

    function showTwoFa(info) {
      form.hidden = true;
      twoFaError.textContent = "";
      document.getElementById("twoFaInfo").textContent = info;
      twoFaForm.hidden = false;
      document.getElementById("twoFaCode").focus();
    }

    function showLogin() {
      twoFaForm.hidden = true;
      form.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      error.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        error.textContent = "Заполните все поля";
        return;
      }

      const btn = form.querySelector("button[type=submit]");
      btn.disabled = true;
      btn.textContent = "Вход...";

      const res = await window.kittyAuth.signIn(email, password).catch((err) => ({ error: err.message }));
      btn.disabled = false;
      btn.textContent = "Войти";

      if (res && res.error) {
        error.textContent = "Неверный email или пароль";
        return;
      }

      // Проверка на бан
      const profile = await window.kittyAuth.getProfile();
      if (profile && profile.banned) {
        await window.kittyAuth.signOut();
        error.textContent = "Аккаунт забанен. Обратитесь к администрации.";
        return;
      }

      const sess = await window.kittyAuth.getSession();
      if (!sess) {
        error.textContent = "Не удалось получить сессию.";
        return;
      }
      pendingSession = sess;

      // Запрос 2FA: требует ли аккаунт код
      let resp;
      try {
        resp = await fetch(SITE + "/functions/v1/send-2fa", {
          method: "POST",
          headers: { Authorization: "Bearer " + sess.access_token, "Content-Type": "application/json" },
          body: "{}"
        });
      } catch (err) {
        error.textContent = "Ошибка сети: " + err.message;
        return;
      }

      let data = {};
      try { data = await resp.json(); } catch (err) { /* ignore */ }

      if (data && data.error === "2fa_not_required") {
        window.location.href = "cabinet.html";
        return;
      }
      if (resp.status === 429 || (data && data.error === "locked")) {
        error.textContent = data.message || "Слишком много попыток. Попробуйте позже.";
        return;
      }
      if (data && data.error === "not_configured") {
        error.textContent = "2FA временно недоступно (ошибка на сервере).";
        return;
      }
      if (!data || !data.ok) {
        error.textContent = "Не удалось отправить код. Попробуйте позже.";
        return;
      }

      showTwoFa("Код отправлен в Telegram. Введите его ниже (действует 5 минут).");
    });

    twoFaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      twoFaError.textContent = "";
      const code = document.getElementById("twoFaCode").value.trim();
      if (!/^\d{6}$/.test(code)) {
        twoFaError.textContent = "Введите 6 цифр кода";
        return;
      }
      if (!pendingSession) {
        showLogin();
        return;
      }

      const btn = document.getElementById("twoFaSubmit");
      btn.disabled = true;
      btn.textContent = "Проверка...";

      let resp;
      try {
        resp = await fetch(SITE + "/functions/v1/verify-2fa", {
          method: "POST",
          headers: { Authorization: "Bearer " + pendingSession.access_token, "Content-Type": "application/json" },
          body: JSON.stringify({ code })
        });
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Подтвердить";
        twoFaError.textContent = "Ошибка сети: " + err.message;
        return;
      }

      let data = {};
      try { data = await resp.json(); } catch (err) { /* ignore */ }
      btn.disabled = false;
      btn.textContent = "Подтвердить";

      if (data && data.ok) {
        window.location.href = "cabinet.html";
        return;
      }
      if (resp.status === 429 || (data && data.error === "locked")) {
        twoFaError.textContent = "Слишком много попыток. Вход заблокирован на 15 минут.";
        return;
      }
      twoFaError.textContent = "Неверный код. Попробуйте ещё раз.";
    });

    document.getElementById("twoFaBack").addEventListener("click", () => {
      pendingSession = null;
      showLogin();
    });

    // Демо-вход
    document.getElementById("demoLogin").addEventListener("click", () => {
      error.textContent = "Демо-вход недоступен в онлайн-версии. Зарегистрируйтесь или войдите.";
    });
  </script>

</body>
</html>
